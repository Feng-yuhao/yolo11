  - [[-1, 13], 1, Concat, [1]]                # 22 = E1 18
  - [-1, 2, C3k2, [512, False]]               # 23 = E1 19, P4
  - [-1, 1, Conv, [512, 3, 2]]               # 24 = E1 20
