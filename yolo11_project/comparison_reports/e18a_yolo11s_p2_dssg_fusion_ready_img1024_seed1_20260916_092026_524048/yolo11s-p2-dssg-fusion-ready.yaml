# E18a: strict E10a + E17a combination on the frozen E1 (YOLO11s + P2) base.
# Keeps E17a pre-Concat FusionReadyAdapter + training-only auxiliary supervision,
# then applies the original E10a DeepSemanticGuide + SemanticDetailGate after the
# unchanged PAN/P2 path. No E10clean, DySample, slicing, PGALP, P3SDE or E16a TSDR.
# All three upsampling paths remain nearest-neighbor 2x.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

e17_aux:
  enabled: true
  gain: 0.1
  min_feature_side: 1.5
  negative_weight: 0.1
  box_weight: 0.25

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 11 P5 -> P4
  - [[11, 6], 1, FusionReadyAdapter, [32, 0.05]]         # 12 adapted backbone P4
  - [[11, 12], 1, Concat, [1]]                           # 13 original Concat
  - [-1, 2, C3k2, [512, False]]                          # 14 neck P4 (top-down)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 15 P4 -> P3
  - [[15, 4], 1, FusionReadyAdapter, [32, 0.05]]         # 16 adapted backbone P3
  - [[15, 16], 1, Concat, [1]]                           # 17 original Concat
  - [-1, 2, C3k2, [256, False]]                          # 18 neck P3

  # Frozen E17a/E1 PAN down path.
  - [-1, 1, Conv, [256, 3, 2]]                           # 19
  - [[-1, 14], 1, Concat, [1]]                           # 20
  - [-1, 2, C3k2, [512, False]]                          # 21 neck P4
  - [-1, 1, Conv, [512, 3, 2]]                           # 22
  - [[-1, 10], 1, Concat, [1]]                           # 23
  - [-1, 2, C3k2, [1024, True]]                          # 24 neck P5

  # Frozen E1 P2 extension.
  - [18, 1, nn.Upsample, [None, 2, "nearest"]]          # 25 P3 -> P2
  - [[25, 2], 1, Concat, [1]]                            # 26
  - [-1, 2, C3k2, [256, False]]                          # 27 fused P2

  # Original E10a DSSG, unchanged internally.
  # args: hidden_ratio, topk_ratio, sparse_mix, layer_scale_init
  - [[18, 21, 24], 1, DeepSemanticGuide, [0.25, 0.0625, 0.5, 0.05]]  # 28 P3_sem
  # args: layer_scale_init
  - [[27, 28], 1, SemanticDetailGate, [0.05]]            # 29 P2_sem

  # First four inputs are formal Detect features. Last two are training-only
  # auxiliary sources consumed by the already-fixed E17Detect implementation.
  - [[29, 28, 21, 24, 12, 16], 1, E17Detect, [nc]]      # 30
