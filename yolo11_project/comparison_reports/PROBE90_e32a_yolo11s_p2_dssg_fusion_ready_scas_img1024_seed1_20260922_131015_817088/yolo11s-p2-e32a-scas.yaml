# E32a: E18a inference graph + Scale-Consistent Auxiliary Supervision.
# Inference topology is byte-for-byte the E18a design: E1 P2 + two
# FusionReadyAdapter modules + DSSG + E17Detect.  Only the training-only
# auxiliary target construction changes.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

e17_aux:
  enabled: true
  gain: 0.1
  min_feature_side: 1.5
  negative_weight: 0.1
  box_weight: 0.25

e32_aux:
  enabled: true
  classification_owner: p4_if_valid_else_p3
  regression_owner: coarsest_valid_else_none
  negative_ignore: all_gt_both_levels_3x3
  classification_collision: unique_image_class_cell
  regression_collision: largest_box_per_image_cell
  level_aggregation: equal_level_mean

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[11, 6], 1, FusionReadyAdapter, [32, 0.05]]
  - [[11, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[15, 4], 1, FusionReadyAdapter, [32, 0.05]]
  - [[15, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [18, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[25, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [[18, 21, 24], 1, DeepSemanticGuide, [0.25, 0.0625, 0.5, 0.05]]
  - [[27, 28], 1, SemanticDetailGate, [0.05]]
  - [[29, 28, 21, 24, 12, 16], 1, E17Detect, [nc]]
