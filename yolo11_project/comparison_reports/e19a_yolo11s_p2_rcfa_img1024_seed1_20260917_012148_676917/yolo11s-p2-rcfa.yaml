# E19a: E17a controlled replacement with reliability-conditioned local alignment.
# Only FusionReadyAdapter is replaced. E17Detect and auxiliary loss stay unchanged.
nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

e17_aux:
  enabled: true
  gain: 0.1
  min_feature_side: 1.5
  negative_weight: 0.1
  box_weight: 0.25

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 11 P5 -> P4
  - [[11, 6], 1, RCFAAdapter, [32, 0.05, 4.0]]            # 12 aligned P4 lateral
  - [[11, 12], 1, Concat, [1]]                            # 13
  - [-1, 2, C3k2, [512, False]]                           # 14 neck P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 15 P4 -> P3
  - [[15, 4], 1, RCFAAdapter, [32, 0.05, 4.0]]            # 16 aligned P3 lateral
  - [[15, 16], 1, Concat, [1]]                            # 17
  - [-1, 2, C3k2, [256, False]]                           # 18 neck P3
  - [-1, 1, Conv, [256, 3, 2]]                            # 19 PAN down
  - [[-1, 14], 1, Concat, [1]]                            # 20
  - [-1, 2, C3k2, [512, False]]                           # 21 neck P4
  - [-1, 1, Conv, [512, 3, 2]]                            # 22 PAN down
  - [[-1, 10], 1, Concat, [1]]                            # 23
  - [-1, 2, C3k2, [1024, True]]                           # 24 neck P5
  - [18, 1, nn.Upsample, [None, 2, "nearest"]]           # 25 frozen P2 extension
  - [[-1, 2], 1, Concat, [1]]                             # 26
  - [-1, 2, C3k2, [256, False]]                           # 27 neck P2
  - [[27, 18, 21, 24, 12, 16], 1, E17Detect, [nc]]       # 28 P2/P3/P4/P5 + aux
