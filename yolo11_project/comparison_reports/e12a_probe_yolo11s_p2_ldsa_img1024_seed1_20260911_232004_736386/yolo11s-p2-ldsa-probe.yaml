# E12a probe: E10a with local discriminative semantic attention (LDSA).
# D10-proven P3/P2 spatial gates are retained. The inactive pooled P4/P5
# channel path is replaced by P3-query/P4-key-value local attention.
# No DySample, PGALP, P3SDE, CBSG loss or extra spatial gate is present.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 P5->P4
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 P4->P3
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, False]]                  # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                  # 22 P5/32

  # Frozen E1 P2 extension, still nearest-neighbour.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23 P3->P2
  - [[-1, 2], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [256, False]]                  # 25 fused P2/4

  # E12a: P3-query/P4-semantic 5x5 local attention at P4 resolution.
  # args: attention_ratio, heads, kernel_size, attention_gain_init, layer_scale_init
  - [[16, 19], 1, LocalDiscriminativeSemanticGuide, [0.5, 4, 5, 0.0, 0.05]] # 26 P3_sem

  # Exact E10a P2 semantic/detail spatial gate; copied and frozen in the probe.
  - [[25, 26], 1, SemanticDetailGate, [0.05]] # 27 P2_sem
  - [[27, 26, 19, 22], 1, Detect, [nc]]       # 28 P2/P3/P4/P5
