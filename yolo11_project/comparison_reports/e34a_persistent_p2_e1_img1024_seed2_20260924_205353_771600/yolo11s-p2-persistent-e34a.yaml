# E34a: E1 + persistent P2 state across backbone P3/P4 stages.
# Fixed s scale, hidden=32, fixed update/feedback gain=0.1.
# Original backbone blocks, neck blocks, loss/TAL and four Detect towers remain.
nc: 10
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0 B1 /2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2 B2 /4
  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4 B3 /8
  - [[2, 4], 1, PersistentP2Stage1, [32, 0.1]] # 5 H1 /4
  - [[4, 5], 1, PersistentP2Feedback, [32, 0.1]] # 6 B3-to-deep /8
  - [6, 1, Conv, [512, 3, 2]]                  # 7 original layer 5
  - [-1, 2, C3k2, [512, True]]                 # 8 B4 /16
  - [[5, 8], 1, PersistentP2Stage2, [32, 0.1]] # 9 H2 /4
  - [8, 1, Conv, [1024, 3, 2]]                 # 10 original layer 7
  - [-1, 2, C3k2, [1024, True]]                # 11
  - [-1, 1, SPPF, [1024, 5]]                   # 12
  - [-1, 2, C2PSA, [1024]]                     # 13 B5 /32

head:
  - [13, 1, nn.Upsample, [None, 2, nearest]]   # 14
  - [[-1, 8], 1, Concat, [1]]                   # 15 original B4 lateral
  - [-1, 2, C3k2, [512, False]]                # 16 neck P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]   # 17
  - [[-1, 4], 1, Concat, [1]]                   # 18 original B3 lateral
  - [-1, 2, C3k2, [256, False]]                # 19 neck P3
  - [-1, 1, Conv, [256, 3, 2]]                 # 20
  - [[-1, 16], 1, Concat, [1]]                  # 21
  - [-1, 2, C3k2, [512, False]]                # 22 neck P4
  - [-1, 1, Conv, [512, 3, 2]]                 # 23
  - [[-1, 13], 1, Concat, [1]]                  # 24
  - [-1, 2, C3k2, [1024, True]]                # 25 neck P5
  - [19, 1, nn.Upsample, [None, 2, nearest]]   # 26
  - [[-1, 9], 1, Concat, [1]]                   # 27 use H2, not original B2
  - [-1, 2, C3k2, [256, False]]                # 28 neck P2
  - [[28, 19, 22, 25], 1, Detect, [nc]]        # 29 P2/P3/P4/P5
