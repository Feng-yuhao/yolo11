# E13a paired probe: E10a graph with classification-exclusive semantic guidance.
# E0 remains the original YOLO11s baseline; E1 remains the P2 experimental base.
# E10a is only the common converged initialization used by C13 and E13a.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 22 P5/32

  # E1 P2 extension; unchanged and still nearest-neighbour.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                  # 25 fused P2/4

  # Existing E10a candidate gates; copied from the same frozen E10a checkpoint.
  - [[16, 19, 22], 1, DeepSemanticGuide, [0.25, 0.0625, 0.5, 0.05]] # 26 P3_sem
  - [[25, 26], 1, SemanticDetailGate, [0.05]]                       # 27 P2_sem

  # E13a only: P3->P2 and P4->P3 guidance inside classification cv3.
  # Regression cv2 receives the original four input tensors.
  # args: nc, hidden_ratio, topk_ratio, zero residual gain
  - [[27, 26, 19, 22], 1, SGCDDetect, [nc, 0.25, 0.0625, 0.0]]
