# E21a RSG-DSSG
# Inference topology is EXACTLY E10a DSSG.
# Only training adds Relative Small-aware Gate guidance on P2 spatial-gate logits.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

rsg:
  enabled: true
  gain: 0.02
  warmup_epochs: 20.0
  batches_per_epoch: 809
  max_aux_ratio: 0.05
  tiny_equivalent_side: 32.0
  margin: 0.25
  sigma_scale: 0.35
  sigma_min: 0.75
  sigma_max: 2.50
  radius: 6
  log_interval: 1000

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11 P5->P4
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14 P4->P3
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, False]]                  # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                  # 22 P5/32

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]  # 23 P3->P2
  - [[-1, 2], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [256, False]]                  # 25 fused P2/4

  - [[16, 19, 22], 1, DeepSemanticGuide, [0.25, 0.0625, 0.5, 0.05]] # 26 P3_sem/8
  - [[25, 26], 1, SemanticDetailGate, [0.05]]                       # 27 P2_sem/4
  - [[27, 26, 19, 22], 1, Detect, [nc]]                             # 28
