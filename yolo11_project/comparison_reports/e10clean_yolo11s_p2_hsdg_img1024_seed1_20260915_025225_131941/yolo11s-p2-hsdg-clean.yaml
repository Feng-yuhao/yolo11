# E10-clean: E1 P2 baseline plus clean P4->P3->P2 spatial semantic guidance.
# No P5 descriptor, Top-K pooling, channel gate, DySample, PGALP, P3SDE or TSDR.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 P5->P4
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 P4->P3
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, False]]                  # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                  # 22 P5/32

  # Frozen E1 high-resolution P2 branch.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23 P3->P2
  - [[-1, 2], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [256, False]]                  # 25 fused P2/4

  # Clean HSDG: P4 semantics are spatially selected at P3, then guided to P2.
  # args: layer_scale_init, gate_hidden
  - [[16, 19], 1, P4P3SpatialGuide, [0.05, 16]]  # 26 P3_sem/8
  - [[25, 26], 1, P3P2DetailGuide, [0.05, 16]]   # 27 P2_sem/4
  - [[27, 26, 19, 22], 1, Detect, [nc]]          # 28 P2/P3/P4/P5
