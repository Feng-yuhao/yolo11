# E8b-clean: frozen E1 P2 baseline plus one P3 detail-semantic enhancer.
# All three top-down upsampling paths remain nearest-neighbor.
# Enhanced P3 feeds P3 Detect and P3->P2; P4/P5 bottom-up retains raw P3.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11 P5->P4
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14 P4->P3
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 raw P3/8

  # E8b-clean's only architectural addition.
  - [-1, 1, P3SDE, [1.0, 5, 2, 0.001]]          # 17 enhanced P3/8

  # Preserve the original P4/P5 bottom-up path by reading raw P3 layer 16.
  - [16, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 13], 1, Concat, [1]]                  # 19
  - [-1, 2, C3k2, [512, False]]                  # 20 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 10], 1, Concat, [1]]                  # 22
  - [-1, 2, C3k2, [1024, True]]                  # 23 P5/32

  # Clean E1 P2 extension; P3->P2 also remains nearest-neighbor.
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 2], 1, Concat, [1]]                    # 25
  - [-1, 2, C3k2, [256, False]]                  # 26 P2/4
  - [[26, 17, 20, 23], 1, Detect, [nc]]          # 27 P2/P3/P4/P5
