# E11a probe: frozen E10a graph with contrastive-background P3/P2 gates.
# All original YOLO11s and E1 P2 paths remain unchanged; no DySample/PGALP/P3SDE.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

cbsg:
  enabled: true
  p3_loss_weight: 0.02
  p2_loss_weight: 0.04
  focal_gamma: 2.0
  negative_balance: 0.25
  small_boost: 1.5
  p3_dilation: 3
  p2_dilation: 5

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 P5->P4
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 P4->P3
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, False]]                  # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                  # 22 P5/32

  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23 P3->P2
  - [[-1, 2], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [256, False]]                  # 25 fused P2/4

  # Same E10a semantic projections/residuals. The legacy P4/P5 channel output
  # is fixed at 0.5; only the two spatial gates receive local contrast terms.
  - [[16, 19, 22], 1, CBSGDeepSemanticGuide, [0.25, 0.0625, 0.5, 0.05, 7]] # 26 P3_sem
  - [[25, 26], 1, CBSGDetailGate, [0.05, 9]]                               # 27 P2_sem
  - [[27, 26, 19, 22], 1, Detect, [nc]]                                    # 28
