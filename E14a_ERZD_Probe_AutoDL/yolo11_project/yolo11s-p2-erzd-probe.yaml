# E14a: E1 graph unchanged; ER-ZD exists only in the training criterion.
# Inference is exactly the 27-layer YOLO11s + P2 architecture.
nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Training-only error-aware regional zoom distillation configuration.
erzd:
  enabled: true
  crop_fraction: 0.5625
  crops_per_batch: 2
  tiny_side_px: 32.0
  max_targets_per_crop: 48
  anchor_candidates: 16
  levels: [0, 1]                 # Detect P2 and P3 outputs only
  teacher_patch_radius: [3, 2]
  student_patch_radius: [1, 1]
  max_loss_weight: 0.25
  ramp_epochs: 5
  min_teacher_conf: 0.08
  teacher_margin: 0.03
  wrong_class_weight: 0.5

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [[25, 16, 19, 22], 1, Detect, [nc]]
